# Mosquitto configuration — smart-youtube-face-control (LOCAL DEVELOPMENT DEMO)
#
# WARNING: anonymous access is for a local LAN demo only.
# Never expose this broker to the public internet.

# ------------------------------------------------------------
# MQTT (TCP) listener — XIAO ESP32S3 Sense (via host LAN IP) and control-gateway
# ------------------------------------------------------------
listener 1883
allow_anonymous true

# ------------------------------------------------------------
# MQTT over WebSocket listener (reserved, disabled)
# Uncomment and also uncomment the 9001 port mapping in docker-compose.yml.
# ------------------------------------------------------------
# listener 9001
# protocol websockets

# ------------------------------------------------------------
# Future: authentication (see services/mqtt-broker/README.md)
# ------------------------------------------------------------
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# ------------------------------------------------------------
# Persistence / Logging
# ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
