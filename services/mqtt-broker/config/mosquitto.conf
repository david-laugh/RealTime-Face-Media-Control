# Mosquitto configuration — smart-youtube-face-control (development skeleton)

# ------------------------------------------------------------
# MQTT (TCP) listener — used by XIAO ESP32S3 Sense and Control Gateway
# ------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# ------------------------------------------------------------
# MQTT over WebSocket listener (reserved, disabled)
# Uncomment to allow browser-based MQTT clients to connect directly.
# Also uncomment the 9001 port mapping in docker-compose.yml.
# ------------------------------------------------------------
# listener 9001 0.0.0.0
# protocol websockets

# ------------------------------------------------------------
# Authentication
# Development only: anonymous access is allowed.
# TODO: Configure password_file / ACL before any non-local deployment.
# ------------------------------------------------------------
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# ------------------------------------------------------------
# Persistence / Logging
# ------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
