<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero-Touch 미디어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#f4f3ef; --card:#ffffff; --ink:#18263a; --soft:#5d6878; --rule:#e2dfd7;
  --navy:#1f4e79; --navy-tint:#e3ecf5; --red:#c8502e; --red-tint:#f8e6df; --idle:#cfd3d9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121820; --card:#1a222c; --ink:#e9ecf0; --soft:#93a0b0; --rule:#2a3440;
  --navy:#6aa6dc; --navy-tint:#1d3043; --red:#ec7a56; --red-tint:#3a2420; --idle:#3a4553;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h1 small{display:block;font-size:15px;font-weight:500;color:var(--soft);letter-spacing:0;margin-top:6px}
.conn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--rule);font-size:13.5px;font-weight:600;color:var(--soft)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.conn.on{color:var(--navy)} .conn.on i{background:var(--navy);box-shadow:0 0 0 4px var(--navy-tint)}
.conn.off{color:var(--red)} .conn.off i{background:var(--red)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

/* 영상: 보고 있으면 실선, 아니면 점선 (발표자료의 시선 선과 같은 규칙) */
.screen{position:relative;border-radius:18px;padding:8px;background:var(--card);
  outline:3px solid var(--navy);outline-offset:-3px;transition:outline-color .3s}
.screen.away{outline:3px dashed var(--idle)}
.screen.lost{outline:3px dashed var(--red)}
.ratio{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#player{position:absolute;inset:0;width:100%;height:100%;transition:filter .35s}
.screen:not(.watch) #player{filter:grayscale(1) brightness(.6)}
#gate{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(12,18,28,.78);color:#fff;text-align:center;padding:20px}
#gate p{margin:0;font-size:14px;opacity:.8}
#start{font:inherit;font-size:17px;font-weight:700;padding:15px 30px;border:0;border-radius:999px;background:var(--red);color:#fff;cursor:pointer}
#start:hover{filter:brightness(1.08)}

.ribbon{margin-top:14px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px 12px}
.ribbon-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft);margin-bottom:10px;gap:10px;flex-wrap:wrap}
.ribbon-head b{color:var(--ink);font-weight:700;font-size:14px}
.legend{display:flex;gap:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:14px;height:6px;border-radius:3px;background:var(--c)}
canvas{display:block;width:100%;height:34px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft);margin-top:6px;font-variant-numeric:tabular-nums}

aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px}
.state{display:flex;align-items:center;gap:16px}
.face{width:64px;height:64px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--rule);color:var(--soft);transition:background .3s,color .3s}
.watch .face{background:var(--navy-tint);color:var(--navy)}
.lost .face{background:var(--red-tint);color:var(--red)}
.face svg{width:40px;height:40px}
#label{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.watch #label{color:var(--navy)} .lost #label{color:var(--red)}
#meta{font-size:13px;color:var(--soft);margin-top:3px}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 0}
.stat{padding:12px 14px}
.stat+.stat{border-left:1px solid var(--rule)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--soft)}

.ctl label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.ctl+.ctl{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
.row{display:flex;gap:6px}
input{flex:1;min-width:0;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink)}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 13px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .btn[aria-pressed="true"][data-v="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg .btn[aria-pressed="true"][data-v="false"]{background:var(--red);border-color:var(--red);color:#fff}
.hint{font-size:12px;color:var(--soft);margin:8px 0 0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

details{margin-top:18px;font-size:13px;color:var(--soft)}
summary{cursor:pointer;font-weight:600;width:max-content}
#log{margin-top:8px;max-height:150px;overflow:auto;line-height:1.75;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">

<header>
  <h1>Zero-Touch 미디어<small>화면을 보면 재생되고, 자리를 비우면 멈춥니다.</small></h1>
  <div class="conn" id="conn"><i></i><span id="connText">게이트웨이 연결 중</span></div>
</header>

<div class="grid">
  <section>
    <div class="screen away" id="screen"><div class="ratio">
      <div id="player"></div>
      <div id="gate"><button id="start">시작하기</button><p>한 번 눌러 두면 이후로는 얼굴 신호만으로 재생과 정지가 바뀝니다.</p></div>
    </div></div>

    <div class="ribbon">
      <div class="ribbon-head"><b>최근 60초</b>
        <div class="legend"><span style="--c:var(--navy)">보고 있음</span><span style="--c:var(--red)">자리 비움</span><span style="--c:var(--idle)">신호 없음</span></div>
      </div>
      <canvas id="ribbon"></canvas>
      <div class="axis"><span>60초 전</span><span>30초 전</span><span>지금</span></div>
    </div>
  </section>

  <aside>
    <div class="card" id="status">
      <div class="state">
        <div class="face" id="face"></div>
        <div><div id="label">신호 기다리는 중</div><div id="meta">게이트웨이 명령이 아직 없습니다.</div></div>
      </div>
    </div>

    <div class="card stats">
      <div class="stat"><b id="sWatch">0:00</b><span>시청 시간</span></div>
      <div class="stat"><b id="sPause">0</b><span>자동 정지</span></div>
      <div class="stat"><b id="sConf">-</b><span>신뢰도</span></div>
    </div>

    <div class="card">
      <div class="ctl">
        <label for="yt">유튜브 주소</label>
        <div class="row"><input id="yt" placeholder="https://youtu.be/..."><button class="btn" id="load">바꾸기</button></div>
      </div>
      <div class="ctl" id="testCtl" hidden>
        <label>게이트웨이 없이 시험하기</label>
        <div class="seg"><button class="btn" data-v="true" aria-pressed="false">얼굴 있음</button><button class="btn" data-v="false" aria-pressed="false">얼굴 없음</button></div>
        <p class="hint">개발·발표 대비용입니다. 이 화면 안에서만 가짜 명령을 만들고, 켜 두면 게이트웨이 명령은 무시합니다. 주소 끝에 ?test=1 을 붙였을 때만 보입니다.</p>
      </div>
    </div>
  </aside>
</div>

<details><summary>동작 기록</summary><div id="log"></div></details>
</div>
<script>
/* web-ui (Member C)
 * 입력: control-gateway WebSocket  contracts/websocket/media-control.schema.json
 *   {"type":"media_control","device_id":"xiao-01","command":"PLAY"|"PAUSE",
 *    "reason":"FRONT_FACE_PRESENT"|"FACE_ABSENT"|"DEVICE_TIMEOUT"|"UNKNOWN",
 *    "confidence":0.84|null,"ts_server_ms":1793320123456}
 * PLAY/PAUSE 판단(debounce, timeout)은 게이트웨이 담당이라 여기서는 받은 명령을 그대로 따른다.
 * 설정: 주소 뒤에 ?ws=ws://호스트:8000/ws  &v=유튜브ID  로 바꿀 수 있음.
 * 시험 버튼: 실제로는 카메라가 판단하므로 평소엔 숨김. ?test=1 일 때만 보임 (개발 확인, 발표 비상용).
 */
const params = new URLSearchParams(location.search);
const WS_URL = params.get("ws") || `ws://${location.hostname || "localhost"}:8000/ws`;
const DEFAULT_VIDEO = params.get("v") || "M7lc1UVf-VE";
const RIBBON_SEC = 60;
if (params.get("test") === "1") document.getElementById("testCtl").hidden = false;

const REASON = {
  FRONT_FACE_PRESENT: { kind: "watch", label: "보고 있어요",  meta: "정면 얼굴이 보여서 재생합니다." },
  FACE_ABSENT:        { kind: "away",  label: "자리 비움",    meta: "얼굴이 보이지 않아 멈췄습니다." },
  DEVICE_TIMEOUT:     { kind: "none",  label: "카메라 끊김",  meta: "ESP32 신호가 끊겨 멈췄습니다." },
  UNKNOWN:            { kind: "none",  label: "판단 불가",    meta: "상태를 알 수 없어 멈췄습니다." },
};

const FACE_FRONT = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="20" cy="18" r="11"/><circle cx="16" cy="17" r="1.3" fill="currentColor" stroke="none"/><circle cx="24" cy="17" r="1.3" fill="currentColor" stroke="none"/><path d="M16 22.5q4 3 8 0"/><path d="M9 37q11-8 22 0"/></svg>';
const FACE_SIDE = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30V26a11 11 0 1 1 13-14l3 6-3 1v4a3 3 0 0 1-3 3h-3v4"/><path d="M8 37q8-5 16-2"/></svg>';
const FACE_NONE = '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 4"><circle cx="20" cy="18" r="11"/><path d="M9 37q11-8 22 0"/></svg>';

let player, ready = false, started = false;
let pending = null;            // 시작 전에 받은 마지막 명령
let current = "none";          // 타임라인용 현재 상태
let watchSec = 0, pauses = 0, lastTick = performance.now();
let simTimer = null, simValue = null;
const samples = [];
const $ = id => document.getElementById(id);
const log = m => { const d = document.createElement("div"); d.textContent = new Date().toLocaleTimeString() + "  " + m; $("log").prepend(d); };

/* ---------- YouTube ---------- */
function videoId(s){
  s = s.trim(); if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/); return m ? m[1] : null;
}
const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", { videoId: DEFAULT_VIDEO,
    playerVars: { playsinline: 1, rel: 0, origin: location.origin },
    events: { onReady: () => { ready = true; log("유튜브 플레이어 준비됨"); } } });
};
// 브라우저 자동재생 정책 때문에 첫 재생은 사용자가 한 번 눌러야 함
$("start").onclick = () => {
  started = true; $("gate").remove();
  if (ready) { player.playVideo(); player.pauseVideo(); }
  log("시작됨, 이제 게이트웨이 명령으로 제어");
  if (pending) { const p = pending; pending = null; setTimeout(() => apply(p, "replay"), 300); }
};
$("load").onclick = () => {
  const id = videoId($("yt").value);
  if (!id) return log("유튜브 주소를 알아볼 수 없습니다. youtu.be/ 또는 watch?v= 형식으로 넣어 주세요.");
  if (ready) { player.cueVideoById(id); log("영상 바꿈: " + id); }
};
$("yt").addEventListener("keydown", e => { if (e.key === "Enter") $("load").click(); });

/* ---------- 화면 표시 ---------- */
let lastFace = null;
function show(kind, label, meta){
  const face = kind === "watch" ? FACE_FRONT : kind === "away" ? FACE_SIDE : FACE_NONE;
  if (face !== lastFace) { $("face").innerHTML = face; lastFace = face; }
  const cls = kind === "watch" ? "watch" : kind === "away" ? "lost" : "";
  $("status").className = "card " + cls;
  $("screen").className = "screen " + (kind === "watch" ? "watch" : kind === "away" ? "lost" : "away");
  $("label").textContent = label; $("meta").textContent = meta;
}
function conn(kind, text){ $("conn").className = "conn " + kind; $("connText").textContent = text; }

/* ---------- 명령 처리 ---------- */
function valid(m){
  return m && m.type === "media_control" && (m.command === "PLAY" || m.command === "PAUSE")
    && typeof m.reason === "string" && typeof m.device_id === "string";
}
function apply(m, source){
  const r = REASON[m.reason] || REASON.UNKNOWN;
  current = m.command === "PLAY" ? "watch" : r.kind === "watch" ? "away" : r.kind;
  const delay = source === "ws" && Number.isInteger(m.ts_server_ms) ? Math.max(0, Date.now() - m.ts_server_ms) : null;
  show(current, r.label, `${r.meta} ${m.device_id}${delay !== null ? `, 전달 ${delay}ms` : ""}`);
  $("sConf").textContent = typeof m.confidence === "number" ? Math.round(m.confidence * 100) + "%" : "-";
  if (!ready || !started) { pending = m; return; }
  const st = player.getPlayerState();
  if (m.command === "PLAY") {
    if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) { player.playVideo(); log(`PLAY (${m.reason})`); }
  } else if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) {
    player.pauseVideo(); pauses++; log(`PAUSE (${m.reason})`);
  }
}

/* ---------- WebSocket (자동 재연결) ---------- */
let ws, retry = 0;
function connect(){
  conn("", "게이트웨이 연결 중");
  try { ws = new WebSocket(WS_URL); } catch (e) { log("WebSocket 주소가 잘못되었습니다: " + WS_URL); return; }
  ws.onopen = () => { retry = 0; conn("on", "게이트웨이 연결됨"); log("연결됨: " + WS_URL); };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return log("JSON이 아닌 메시지를 무시했습니다."); }
    if (!valid(m)) return log("규약과 다른 메시지를 무시했습니다: " + String(ev.data).slice(0, 80));
    if (simValue !== null) return;   // 시험 모드 중에는 실제 명령 무시
    apply(m, "ws");
  };
  ws.onclose = () => {
    conn("off", "게이트웨이 끊김");
    if (simValue === null) {
      current = "none";
      show("none", "게이트웨이 끊김", "control-gateway가 켜져 있는지 확인하세요. 다시 연결하는 중입니다.");
      if (ready && started && player.getPlayerState() === YT.PlayerState.PLAYING) { player.pauseVideo(); log("게이트웨이 끊김, 일시정지"); }
    }
    const wait = Math.min(5000, 500 * 2 ** retry++);
    setTimeout(connect, wait);
  };
}

/* ---------- 게이트웨이 없이 시험하기 (화면 안에서만 동작) ---------- */
document.querySelectorAll(".seg .btn").forEach(b => b.onclick = () => {
  clearInterval(simTimer); simTimer = null;
  document.querySelectorAll(".seg .btn").forEach(x => x.setAttribute("aria-pressed", "false"));
  if (simValue === b.dataset.v) { simValue = null; log("시험 모드 끔"); return; }
  simValue = b.dataset.v; b.setAttribute("aria-pressed", "true");
  const fake = () => apply({ type: "media_control", device_id: "test", command: simValue === "true" ? "PLAY" : "PAUSE",
    reason: simValue === "true" ? "FRONT_FACE_PRESENT" : "FACE_ABSENT", confidence: null, ts_server_ms: Date.now() }, "sim");
  fake(); simTimer = setInterval(fake, 1000);
});

/* ---------- 타임라인과 숫자 ---------- */
function drawRibbon(){
  const c = $("ribbon"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext("2d"), css = getComputedStyle(document.documentElement);
  const col = { watch: css.getPropertyValue("--navy"), away: css.getPropertyValue("--red"), none: css.getPropertyValue("--idle") };
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  g.save(); g.fillStyle = css.getPropertyValue("--rule"); g.beginPath(); g.roundRect(0, 0, w, h, 6); g.fill(); g.clip();
  const now = performance.now(), span = RIBBON_SEC * 1000;
  let i = 0;
  while (i < samples.length) {
    let j = i; while (j + 1 < samples.length && samples[j + 1][1] === samples[i][1]) j++;
    const t1 = samples[i][0], t2 = j + 1 < samples.length ? samples[j + 1][0] : now;
    const x1 = Math.max(0, w - (now - t1) / span * w), x2 = w - (now - t2) / span * w;
    if (x2 > 0) { g.fillStyle = col[samples[i][1]]; g.fillRect(Math.round(x1), 0, Math.round(x2) - Math.round(x1), h); }
    i = j + 1;
  }
  g.restore();
}
function tick(){
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (ready && started && player.getPlayerState() === YT.PlayerState.PLAYING) watchSec += dt;
  samples.push([now, current]);
  while (samples.length && now - samples[0][0] > RIBBON_SEC * 1000 + 1000) samples.shift();
  $("sWatch").textContent = Math.floor(watchSec / 60) + ":" + String(Math.floor(watchSec % 60)).padStart(2, "0");
  $("sPause").textContent = pauses;
  drawRibbon();
}

show("none", "신호 기다리는 중", "게이트웨이 명령이 아직 없습니다.");
window.addEventListener("resize", drawRibbon);
setInterval(tick, 200);
connect();
</script></body></html>
